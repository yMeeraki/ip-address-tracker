<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/icon-location.svg"
    />
    <link rel="stylesheet" href="style.css" />
    <title>IP Address Tracker</title>

    <script
      src="https://kit.fontawesome.com/c56e930ffe.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <h1>IP Address Tracker</h1>
      <form>
        <input type="text" placeholder="e.g. 8.8.8.8" />
        <button>
          <i class="fa-solid fa-angle-right" style="color: hsl(0, 0%, 17%)"></i>
        </button>
      </form>
    </header>

    <!-- Add offset value dynamically using the API -->
    <section>
      <div>
        <h6>IP Address</h6>
      </div>
      <div>
        <h6>Location</h6>
      </div>
      <div>
        <h6>Timezone</h6>
        <p>UTC<span></span></p>
      </div>
      <div>
        <h6>ISP</h6>
      </div>
    </section>
    <main></main>
  </body>
  <script type="module" src="index.js"></script>
</html>
