<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- displays site properly based on user's device -->

    <!--  Leaflet's CSS -->

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!--  Leaflet's Script -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/icon-location.svg"
    />
    <link rel="stylesheet" href="style.css" />
    <title>IP Address Tracker</title>

    <script
      src="https://kit.fontawesome.com/c56e930ffe.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <h1>IP Address Tracker</h1>
      <form>
        <input value="8.8.8.8" type="text" placeholder="e.g. 8.8.8.8" />
        <button>
          <i class="fa-solid fa-angle-right"></i>
        </button>
      </form>
    </header>

    <!-- Add offset value dynamically using the API -->
    <section class="information-card">
      <div>
        <h6>IP Address</h6>
        <p id="ip-address">000.000.000.000</p>
      </div>
      <div>
        <h6>Location</h6>
        <p>
          <span id="city">City</span>, <span id="region">Region</span>,
          <span id="country">Country</span>
        </p>
      </div>
      <div>
        <h6>Timezone</h6>
        <p>UTC<span id="timezone">-Timezone</span></p>
      </div>
      <div>
        <h6>ISP</h6>
        <p id="isp">ISP</p>
      </div>
    </section>
    <main id="map"></main>
  </body>
  <script type="module" src="index.js"></script>
</html>
